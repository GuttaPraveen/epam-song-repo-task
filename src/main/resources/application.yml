spring:
  application:
    name: messaging-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

# Retry Configuration
messaging:
  retry:
    max-attempts: 3
    initial-interval: 1000
    max-interval: 10000
    multiplier: 2.0
  
  # Third-party API configurations
  sms:
    api-url: "https://api.sms-provider.com/send"
    api-key: "your-sms-api-key"
    timeout: 30000
  
  whatsapp:
    api-url: "https://api.whatsapp-provider.com/send"
    api-key: "your-whatsapp-api-key"
    timeout: 30000

# Scheduling Configuration
scheduling:
  enabled: true
  retry-failed-messages:
    fixed-delay: 300000  # 5 minutes
  cleanup-old-messages:
    cron: "0 0 2 * * ?"  # Daily at 2 AM

logging:
  level:
    com.example: DEBUG
    org.springframework.retry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"